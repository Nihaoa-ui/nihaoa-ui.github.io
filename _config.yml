# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: 不吃香菜
since: 2026-09-06
subtitle: ''
description: 记踩过的坑、搭过的东西，和没想明白的问题。

# 首页首屏小标题（想改就改这一行）
hero_sub: "落日与晚风，朝朝又暮暮。"

# 首页卷首语（想改就改这一行）
preface: "不吃香菜's blog"
keywords:
author: 小董
language: zh-CN
timezone: 'Asia/Shanghai'

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://blog.jieson.cn
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude:
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# Extensions
theme: paper

# Deployment
deploy:
  type: git
  repo: https://github.com/Nihaoa-ui/nihaoa-ui.github.io.git
  branch: main
  message: "Site updated: {{ now('YYYY-MM-DD HH:mm:ss') }}"

server:
  port: 4000
  compress: false
  header: true

# 评论 / 点赞（giscus：基于 GitHub Discussions）
giscus:
  enable: true
  repo: Nihaoa-ui/nihaoa-ui.github.io
  repo_id: R_kgDOUPuHBQ
  category: Announcements
  category_id: DIC_kwDOUPuHBc4DJHOo
  mapping: pathname
  strict: 0
  reactions_enabled: 1
  input_position: top
  theme: light
  lang: zh-CN
